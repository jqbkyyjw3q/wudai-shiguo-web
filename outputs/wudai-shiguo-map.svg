<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 42px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill:#0f172a; }
      .sub { font: 500 20px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill:#334155; }
      .label { font: 700 24px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill:#fff; }
      .small { font: 500 16px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill:#e2e8f0; }
      .note { font: 500 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill:#334155; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>
  <rect x="40" y="40" width="1320" height="820" rx="24" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="80" y="110" class="title">五代十国地理格局示意图（教学版）</text>
  <text x="80" y="145" class="sub">时间范围：907—979（狭义五代十国）；此图为大致地理分布，非精确疆界</text>

  <!-- background silhouette -->
  <path d="M210,250 L350,200 L560,190 L760,230 L980,300 L1130,430 L1080,620 L900,720 L660,760 L430,720 L280,620 L180,450 Z"
        fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>

  <!-- Later Zhou / Northern Song core -->
  <path d="M450,280 L670,260 L770,330 L740,450 L560,500 L430,430 Z" fill="#2563eb" opacity="0.92" filter="url(#shadow)"/>
  <text x="600" y="370" text-anchor="middle" class="label">后周 / 北宋核心</text>
  <text x="600" y="400" text-anchor="middle" class="small">汴京（开封）｜中原</text>

  <!-- Northern Han -->
  <path d="M730,220 L860,210 L920,290 L850,360 L740,340 L700,270 Z" fill="#e11d48" opacity="0.9" filter="url(#shadow)"/>
  <text x="815" y="285" text-anchor="middle" class="label">北汉</text>
  <text x="815" y="312" text-anchor="middle" class="small">晋阳（太原）</text>

  <!-- Southern Tang -->
  <path d="M690,430 L920,420 L1000,520 L900,640 L730,620 L650,520 Z" fill="#f97316" opacity="0.9" filter="url(#shadow)"/>
  <text x="830" y="525" text-anchor="middle" class="label">南唐</text>
  <text x="830" y="553" text-anchor="middle" class="small">金陵（南京）</text>

  <!-- Wuyue -->
  <path d="M940,500 L1080,520 L1110,610 L1020,700 L920,670 L885,575 Z" fill="#10b981" opacity="0.92" filter="url(#shadow)"/>
  <text x="1000" y="595" text-anchor="middle" class="label">吴越</text>
  <text x="1000" y="623" text-anchor="middle" class="small">杭州</text>

  <!-- Chu / Min / Southern Han quick blocks -->
  <rect x="610" y="620" width="120" height="80" rx="12" fill="#8b5cf6" opacity="0.9"/>
  <text x="670" y="668" text-anchor="middle" class="label" style="font-size:22px">楚</text>

  <rect x="780" y="670" width="120" height="80" rx="12" fill="#06b6d4" opacity="0.9"/>
  <text x="840" y="718" text-anchor="middle" class="label" style="font-size:22px">闽</text>

  <rect x="950" y="720" width="140" height="80" rx="12" fill="#14b8a6" opacity="0.9"/>
  <text x="1020" y="768" text-anchor="middle" class="label" style="font-size:22px">南汉</text>

  <!-- arrows -->
  <line x1="960" y1="555" x2="700" y2="410" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="830" y1="420" x2="620" y2="320" stroke="#dc2626" stroke-width="3" marker-end="url(#m)"/>
  <line x1="810" y1="355" x2="700" y2="330" stroke="#dc2626" stroke-width="3" marker-end="url(#m)"/>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="1080" y="500" class="note">975：南唐并入宋</text>
  <text x="1080" y="530" class="note">978：吴越纳土归宋</text>
  <text x="1080" y="560" class="note">979：北汉灭亡</text>

  <!-- legend -->
  <rect x="90" y="700" width="420" height="130" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="740" class="note" style="font-weight:700">图例</text>
  <rect x="120" y="760" width="18" height="18" fill="#2563eb"/><text x="148" y="775" class="note">中原核心（后周/北宋）</text>
  <rect x="120" y="788" width="18" height="18" fill="#f97316"/><text x="148" y="803" class="note">南唐</text>
  <rect x="320" y="760" width="18" height="18" fill="#10b981"/><text x="348" y="775" class="note">吴越</text>
  <rect x="320" y="788" width="18" height="18" fill="#e11d48"/><text x="348" y="803" class="note">北汉</text>
</svg>
